name: buildcd

on:
  push:

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy
        run: npx eleventy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  cd:
    name: Continuous Deployment to Production
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 1
    environment:
      name: production
      url: https://cd-sample.kinneko.de
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v6
        with:
          name: github-pages
          path: .

      - name: Extract pages artifact tar
        run: |
          set -e
          echo "Looking for .tar file in root..."
          TARFILE=$(find . -maxdepth 1 -type f -name "*.tar" -print -quit)
          if [ -z "$TARFILE" ]; then
            echo "ERROR: No tar archive found in root."
            exit 1
          else
            echo "Found tar archive: $TARFILE"
            mkdir -p _site
            tar -xvf "$TARFILE" -C _site
          fi

      - name: Deploy site via SFTP
        uses: KinNeko-De/deploy-sftp-action@v0
        with:
          ftp_username: ${{ secrets.FTP_USERNAME }}
          ftp_password: ${{ secrets.FTP_PASSWORD }}
          ftp_server: ${{ secrets.FTP_SERVER }}
          local_dir: _site
          remote_dir: .